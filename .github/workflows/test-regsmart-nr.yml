name: test regsmart no-rtp
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@f64ccc5c05f30b5b369f8c92c53bb06e9ef79bb4"

jobs:
  test-regsmart-no-rtp:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Start external services
      run: docker compose up -d
    - name: Ensure pip >= v25.1
      run: python -m pip install "pip >= 25.1"
    - name: Install the project and its dependencies
      run: pip install --group test -e .
    - name: Install pytest-regsmart
      run: |
        pip install "$REGSMART_PACKAGE"
        pip freeze
    - name: Install reportlog
      run: pip install pytest-reportlog
    - name: Test with pytest
      run: coverage run -m pytest -v --report-log=reportlog.jsonl --regsmart --no-rank
      #eu tirei job de coverage aqui, talvez devesse manter
    - name: Upload report-log
      if: ${{ !cancelled() }}   # com mutante o step de teste falha; sem isso o arquivo não sobe
      uses: actions/upload-artifact@v4
      with:
        name: reportlog-regsmart-nr
        path: reportlog.jsonl
        retention-days: 14
        if-no-files-found: warn
