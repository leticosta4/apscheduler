name: test ranking
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  RANKING_PACKAGE: "pytest-ranking"

jobs:
  test:
    name: ranking (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            mode: rkn_qtf
            weight: "1-0-0"
          - python-version: "3.12"
            mode: rkn_recentfail
            weight: "0-1-0"
          - python-version: "3.12"
            mode: rkn_simchgpath
            weight: "0-0-1"
          - python-version: "3.12"
            mode: rkn_hybrid
            weight: "1-1-1"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Start external services
      run: docker compose up -d
    - name: Ensure pip >= v25.1
      run: python -m pip install "pip >= 25.1"
    - name: Install the project and its dependencies
      run: pip install --group test -e .
    
    - name: Install pytest-ranking
      run: |
        pip install "$RANKING_PACKAGE"
        pip freeze

    - name: Restore pytest-ranking cache
      id: restore-pytest-ranking-cache
      if: always()
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
        key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}

    - name: Test with pytest-ranking
      run: coverage run -m pytest -v --rank --rank-weight=${{ matrix.weight }}
      #eu tirei job de coverage aqui, talvez devesse manter
    
    - name: Save pytest-ranking cache
      id: save-pytest-ranking-cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
        key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}
